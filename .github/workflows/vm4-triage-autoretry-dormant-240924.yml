name: VM4 Dormant Auto-Retry Impact

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  impact:
    name: VM4 Dormant Retry Impact Job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record attempt
        run: echo "run_attempt=${{ github.run_attempt }}"

      - name: Fail first attempt
        if: ${{ github.run_attempt == 1 }}
        run: |
          echo "intentional first-attempt failure for VM4 dormant Auto-Retry authz probe"
          exit 1

      - name: Write repository marker on retry
        if: ${{ github.run_attempt > 1 }}
        run: |
          git config user.name "vm4-dormant-autoretry-impact[bot]"
          git config user.email "vm4-dormant-autoretry-impact@users.noreply.github.com"
          git switch -c vm4-triage-dormant-impact-240924
          printf 'created by dormant rerun attempt %s\n' "${{ github.run_attempt }}" > vm4-triage-dormant-impact-240924.txt
          git add vm4-triage-dormant-impact-240924.txt
          git commit -m "VM4 dormant Auto-Retry delegated write impact"
          git push origin HEAD:refs/heads/vm4-triage-dormant-impact-240924
